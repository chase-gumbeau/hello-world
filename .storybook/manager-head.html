<style>
  /* Dark sidebar glow: a radial jade gradient bleeding in from the top-left
     corner. From the Figma sidebar frame: circle r=143.8 centred at
     (-17.5, -49.6) on a 100px-wide panel, #22BD85 fading to transparent.
     Width scales with the sidebar; height stays 144px. The sidebar column
     has no stable class, so it is found as the grandparent of the header. */
  :root[data-theme='dark'] div:has(> div > .sidebar-header) {
    background-image: radial-gradient(
      ellipse 144% 144px at -17.5% -50px,
      #22bd85 0%,
      rgb(15 87 61 / 0) 100%
    );
    background-repeat: no-repeat;
  }
</style>
